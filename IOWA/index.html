<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGT Demo</title>

<style>
body{
    font-family:sans-serif;
    text-align:center;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

h1{
    margin-bottom:30px;
}

#balance{
    font-size:1.5rem;
    font-weight:bold;
    margin-bottom:10px;
}

#trial{
    font-size:1.2rem;
    margin-bottom:30px;
}

.deck-container{
    margin:30px 0;
}

.deck{
    width:140px;
    height:180px;
    margin:10px;
    font-size:2rem;
    cursor:pointer;
}

#feedback{
    min-height:100px;
    margin-top:30px;
    font-size:1.2rem;
}

button:disabled{
    opacity:0.4;
    cursor:not-allowed;
}

#summary{
    margin-top:20px;
}
</style>
</head>

<body>

<h1>アイオワギャンブル課題（デモ）/n
     本課題では、４つのデッキから好きな1つを選んでもらいます。/n
　　　選んだデッキによって報酬か罰金が得られます。/n
　　　選択を100回繰り返します。できるだけ所持金が多く得られるようにデッキを選んでみてください。</h1>

<div id="balance">
    所持金: 2000
</div>

<div id="trial">
    試行: 0 / 100
</div>

<div class="deck-container">

    <button class="deck" onclick="chooseDeck('A')">
        A
    </button>

    <button class="deck" onclick="chooseDeck('B')">
        B
    </button>

    <button class="deck" onclick="chooseDeck('C')">
        C
    </button>

    <button class="deck" onclick="chooseDeck('D')">
        D
    </button>

</div>

<div id="feedback">
    デッキを選択してください
</div>

<div id="summary"></div>

<script>

const MAX_TRIALS = 100;

let balance = 2000;
let trial = 0;
let trialStart = performance.now();

const results = [];

const selectionCounts = {
    A:0,
    B:0,
    C:0,
    D:0
};

/*
期待値

A = -25
B = -22.5

C = +25
D = +22.5
*/

const decks = {

    A:{
        outcomes:[
            {value:100, p:0.5},
            {value:-250, p:0.5}
        ]
    },

    B:{
        outcomes:[
            {value:100, p:0.9},
            {value:-1250, p:0.1}
        ]
    },

    C:{
        outcomes:[
            {value:50, p:0.5},
            {value:0, p:0.5}
        ]
    },

    D:{
        outcomes:[
            {value:50, p:0.9},
            {value:-250, p:0.1}
        ]
    }

};

function sampleOutcome(deckName){

    const deck = decks[deckName];

    const r = Math.random();

    let cumulative = 0;

    for(const outcome of deck.outcomes){

        cumulative += outcome.p;

        if(r <= cumulative){
            return outcome.value;
        }
    }

    return deck.outcomes[
        deck.outcomes.length - 1
    ].value;
}

function chooseDeck(deckName){

    if(trial >= MAX_TRIALS){
        return;
    }

    const rt = Math.round(
        performance.now() - trialStart
    );

    const outcome =
        sampleOutcome(deckName);

    trial++;

    selectionCounts[deckName]++;

    balance += outcome;

    document.getElementById("balance").textContent =
        `所持金: ${balance}`;

    document.getElementById("trial").textContent =
        `試行: ${trial} / ${MAX_TRIALS}`;

    const sign =
        outcome > 0 ? "+" : "";

    document.getElementById("feedback").innerHTML =
        `
        <strong>選択:</strong> ${deckName}<br>
        <strong>結果:</strong> ${sign}${outcome}<br>
        <strong>反応時間:</strong> ${rt} ms
        `;

    results.push({

        trial: trial,

        deck: deckName,

        outcome: outcome,

        balance: balance,

        rt: rt,

        timestamp: Date.now()

    });

    trialStart = performance.now();

    if(trial === MAX_TRIALS){
        finishTask();
    }
}

function finishTask(){

    document
        .querySelectorAll(".deck")
        .forEach(btn => btn.disabled = true);

    const advantageous =
        selectionCounts.C +
        selectionCounts.D;

    const disadvantageous =
        selectionCounts.A +
        selectionCounts.B;

    const netScore =
        advantageous -
        disadvantageous;

    document.getElementById("summary").innerHTML =
        `
        <hr>

        <h2>課題終了</h2>

        <p>最終所持金: ${balance}</p>

        <p>
        A: ${selectionCounts.A} /
        B: ${selectionCounts.B} /
        C: ${selectionCounts.C} /
        D: ${selectionCounts.D}
        </p>

        <p>
        Net Score (C+D)-(A+B):
        <strong>${netScore}</strong>
        </p>

        <button onclick="downloadCSV()">
            CSVダウンロード
        </button>
        `;
}

function downloadCSV(){

    let csv =
        "trial,deck,outcome,balance,rt,timestamp\n";

    results.forEach(r=>{

        csv +=
            [
                r.trial,
                r.deck,
                r.outcome,
                r.balance,
                r.rt,
                r.timestamp
            ].join(",") + "\n";

    });

    const blob =
        new Blob(
            [csv],
            {type:"text/csv"}
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = "igt_data.csv";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);
}

</script>

</body>
</html>
