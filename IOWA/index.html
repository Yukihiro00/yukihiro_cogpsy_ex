<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>IGT Demo</title>

<style>
body{
    font-family:sans-serif;
    text-align:center;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.deck{
    width:140px;
    height:180px;
    margin:10px;
    font-size:2rem;
    cursor:pointer;
}

#balance{
    font-size:1.5rem;
    font-weight:bold;
}

#trial{
    margin-top:10px;
    margin-bottom:20px;
}

#feedback{
    margin-top:20px;
    min-height:80px;
}
</style>
</head>

<body>

<h1>アイオワギャンブル課題</h1>

<div id="start-screen">

    <p>参加者IDを入力してください</p>

    <input
      id="participant-id"
      type="text"
      placeholder="例: P001">

    <br><br>

    <button onclick="startTask()">
      開始
    </button>

</div>

<div id="experiment"
     style="display:none;">

  <div id="balance">
    所持金: 2000
  </div>

  <div id="trial">
    試行: 0 / 100
  </div>

  <div>

      <button class="deck"
              onclick="chooseDeck('A')">
          A
      </button>

      <button class="deck"
              onclick="chooseDeck('B')">
          B
      </button>

      <button class="deck"
              onclick="chooseDeck('C')">
          C
      </button>

      <button class="deck"
              onclick="chooseDeck('D')">
          D
      </button>

  </div>

  <div id="feedback">
  </div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/XXXXX/exec";

const MAX_TRIALS = 100;

let participantId = "";

let balance = 2000;

let trial = 0;

let trialStart;

const results = [];

const counts = {
  A:0,
  B:0,
  C:0,
  D:0
};

const decks = {

  A:{
    outcomes:[
      {value:100,p:0.5},
      {value:-150,p:0.5}
    ]
  },

  B:{
    outcomes:[
      {value:100,p:0.9},
      {value:-1125,p:0.1}
    ]
  },

  C:{
    outcomes:[
      {value:50,p:0.5},
      {value:0,p:0.5}
    ]
  },

  D:{
    outcomes:[
      {value:50,p:0.9},
      {value:-225,p:0.1}
    ]
  }

};

function startTask(){

  participantId =
    document
      .getElementById(
        "participant-id"
      )
      .value
      .trim();

  if(!participantId){

    alert(
      "参加者IDを入力してください"
    );

    return;
  }

  document
    .getElementById(
      "start-screen"
    )
    .style.display = "none";

  document
    .getElementById(
      "experiment"
    )
    .style.display = "block";

  trialStart =
    performance.now();
}

function sampleOutcome(deck){

  const r = Math.random();

  let cum = 0;

  for(const item of decks[deck].outcomes){

    cum += item.p;

    if(r <= cum){

      return item.value;

    }

  }

  return decks[deck]
    .outcomes[
      decks[deck].outcomes.length-1
    ]
    .value;
}

function chooseDeck(deck){

  if(trial >= MAX_TRIALS){

    return;

  }

  const rt = Math.round(
    performance.now()
    - trialStart
  );

  const outcome =
    sampleOutcome(deck);

  balance += outcome;

  trial++;

  counts[deck]++;

  document
    .getElementById("balance")
    .textContent =
      `所持金: ${balance}`;

  document
    .getElementById("trial")
    .textContent =
      `試行: ${trial} / ${MAX_TRIALS}`;

  document
    .getElementById("feedback")
    .innerHTML =
      `
      <p>
      デッキ: ${deck}
      </p>

      <p>
      結果:
      ${outcome > 0 ? "+" : ""}
      ${outcome}
      </p>

      <p>
      反応時間:
      ${rt} ms
      </p>
      `;

  results.push({

    trial,

    deck,

    outcome,

    balance,

    rt,

    timestamp:
      new Date().toISOString()

  });

  trialStart =
    performance.now();

  if(trial >= MAX_TRIALS){

    finishTask();

  }
}

async function finishTask(){

  document
    .querySelectorAll(".deck")
    .forEach(
      b => b.disabled = true
    );

  document
    .getElementById("feedback")
    .innerHTML =
      "<h2>送信中...</h2>";

  try{

    await fetch(
      GAS_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          participantId,

          data:results

        })

      }
    );

    const netScore =
      (counts.C + counts.D)
      -
      (counts.A + counts.B);

    document
      .getElementById(
        "feedback"
      )
      .innerHTML =
      `
      <h2>
      実験終了
      </h2>

      <p>
      最終所持金:
      ${balance}
      </p>

      <p>
      Net Score:
      ${netScore}
      </p>

      <p>
      データ送信完了
      </p>
      `;

  }catch(err){

    document
      .getElementById(
        "feedback"
      )
      .innerHTML =
      `
      <h2>
      実験終了
      </h2>

      <p>
      保存エラー
      </p>

      <pre>
${err}
      </pre>
      `;
  }
}

</script>

</body>
</html>
