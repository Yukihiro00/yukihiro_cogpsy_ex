 <!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Cognitive Psychology Experiments
    </title>

    <style>

        body {

            font-family: sans-serif;

            max-width: 800px;

            margin: 50px auto;

            padding: 20px;

            line-height: 1.8;

        }

        h1 {

            text-align: center;

        }

        .experiment {

            border: 1px solid #cccccc;

            border-radius: 8px;

            padding: 20px;

            margin-top: 20px;

        }

        a.button {

            display: inline-block;

            padding: 10px 20px;

            margin-top: 10px;

            background-color: #0078d4;

            color: white;

            text-decoration: none;

            border-radius: 5px;

        }

        a.button:hover {

            background-color: #005ea6;

        }

    </style>

</head>

<body>

    <h1>

        Cognitive Psychology Experiments

    </h1>

    <p>

        このページでは認知心理学・認知神経科学に関連する
        オンライン実験を公開しています。

    </p>

    <div class="experiment">

        <h2>

            Iowa Gambling Task

        </h2>

        <p>

            不確実な状況における意思決定を測定する課題です。

        </p>

        <a class="button"
           href="./IOWA/">

            実験を開始

        </a>

    </div>

    <div class="experiment">

        <h2>

            Müller-Lyer Illusion Task

        </h2>

        <p>

            ミュラー・リヤー錯視における
            矢羽根角度と知覚される長さの関係を測定する課題です。

        </p>

        <a class="button"
           href="./Muller_Lyer/">

            実験を開始

        </a>

    </div>

    <div class="experiment">

        <h2>

            先行刺激が存在する長さ比較実験

        </h2>

        <p>

            先行刺激がある場合に
            線分の長さを比較するときの行動特性を測定する知覚心理実験。

        </p>

        <a class="button"
           href="./Length_SD/">

            実験を開始

        </a>

    </div>

</body>
