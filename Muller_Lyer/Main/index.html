<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muller-Lyer PSE Experiment</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        max-width: 1000px;
        margin: auto;
        padding: 20px;
        overflow-x: hidden;
      }

    svg {
      border: 1px solid #ccc;
      background: #fff;

      max-width: 100%;
      height: auto;

      display: block;
      margin-left: auto;
      margin-right: auto;
  }

      #responseArea {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-top: 20px;
      }

      button {
        font-size: 1.1rem;
        padding: 10px 20px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
      }
    </style>
  </head>

  <body>
    <h1>Muller-Lyer錯視実験</h1>
    <div id="startScreen">
      <p>長く見える方を選択してください</p>
      <button id="startBtn">開始</button>
    </div>
    <div id="experiment" style="display: none">
      <div id="trialInfo"></div>
     <svg
    id="stimulus"
    viewBox="0 0 800 350"
    width="100%"
    height="auto">
</svg>
      <div id="responseArea">
        <button id="topBtn">↑ 上が長い</button
        ><button id="bottomBtn">↓ 下が長い</button>
      </div>
      <div id="feedback"></div>
    </div>
    <script>
      const GAS_URL = "https://script.google.com/macros/s/AKfycbw3UC6DdJ562iNt9UeqXcE6WbLzS2B8dN9N5BX5EyjzjD2TsGbBH4bNWEk4Ntn-LzA/exec";
      const EXPERIMENT_VERSION = "ML_PSE_v1";
      const STANDARD_LENGTH = 150;
      const LENGTH_RATIOS = [0.8, 0.9, 1.0, 1.1, 1.2];
      const WING_ANGLES = [30, 60, 90, 120, 150];
      const REPETITIONS = 8;
      const BLANK_DURATION = 100;
      const FIXATION_DURATION = 250;
      const participantId = crypto.randomUUID();
      let currentTrial = 0,
        trialStart = null;
      const results = [];
      const trials = [];
      WING_ANGLES.forEach((a) =>
        LENGTH_RATIOS.forEach((r) => {
          for (let i = 0; i < REPETITIONS; i++)
            trials.push({
              angle: a,
              ratio: r,
              comparisonLength: STANDARD_LENGTH * r,
              standardOnTop: Math.random() < 0.5,
            });
        }),
      );
      for (let i = trials.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [trials[i], trials[j]] = [trials[j], trials[i]];
      }
      function setBtns(e) {
        topBtn.disabled = !e;
        bottomBtn.disabled = !e;
      }
      function drawLine(cx, y, len) {
        return `<line x1='${cx - len / 2}' y1='${y}' x2='${cx + len / 2}' y2='${y}' stroke='black' stroke-width='4'/>`;
      }
      function drawML(cx, y, len, angle) {
        const wl = len * 0.25,
          x1 = cx - len / 2,
          x2 = cx + len / 2,
          r = (angle * Math.PI) / 180;
        return `<line x1='${x1}' y1='${y}' x2='${x2}' y2='${y}' stroke='black' stroke-width='4'/><line x1='${x1}' y1='${y}' x2='${x1 + wl * Math.cos(r)}' y2='${y - wl * Math.sin(r)}' stroke='black' stroke-width='4'/><line x1='${x1}' y1='${y}' x2='${x1 + wl * Math.cos(r)}' y2='${y + wl * Math.sin(r)}' stroke='black' stroke-width='4'/><line x1='${x2}' y1='${y}' x2='${x2 - wl * Math.cos(r)}' y2='${y - wl * Math.sin(r)}' stroke='black' stroke-width='4'/><line x1='${x2}' y1='${y}' x2='${x2 - wl * Math.cos(r)}' y2='${y + wl * Math.sin(r)}' stroke='black' stroke-width='4'/>`;
      }
      function showBlank() {
        setBtns(false);
        stimulus.innerHTML = "";
        setTimeout(showFixation, BLANK_DURATION);
      }
      function showFixation() {
        stimulus.innerHTML =
          "<text x='400' y='175' text-anchor='middle' dominant-baseline='middle' font-size='40'>+</text>";
        setTimeout(showTrial, FIXATION_DURATION);
      }
      function showTrial() {
        const t = trials[currentTrial];
        let h = "";
        if (t.standardOnTop) {
          h += drawLine(400, 110, STANDARD_LENGTH);
          h += drawML(400, 240, t.comparisonLength, t.angle);
        } else {
          h += drawML(400, 110, t.comparisonLength, t.angle);
          h += drawLine(400, 240, STANDARD_LENGTH);
        }
        stimulus.innerHTML = h;
        trialInfo.textContent = `試行 ${currentTrial + 1}/${trials.length}`;
        setBtns(true);
        trialStart = performance.now();
      }
      startBtn.onclick = () => {
        startScreen.style.display = "none";
        experiment.style.display = "block";
        showFixation();
      };
      function recordResponse(choice) {
        const t = trials[currentTrial];
        results.push({
          participantId,
          experimentVersion: EXPERIMENT_VERSION,
          trial: currentTrial + 1,
          standardLength: STANDARD_LENGTH,
          comparisonRatio: t.ratio,
          comparisonLength: t.comparisonLength,
          wingAngle: t.angle,
          standardPosition:
          t.standardOnTop
          ? "top"
          : "bottom",
          choice,
          rt: Math.round(performance.now() - trialStart),
          blankDuration: BLANK_DURATION,
          fixationDuration: FIXATION_DURATION,
          timestamp: new Date().toISOString(),
        });
        currentTrial++;
        if (currentTrial >= trials.length) {
          finishTask();
          return;
        }
        showBlank();
      }
      topBtn.onclick = () => recordResponse("top");
      bottomBtn.onclick = () => recordResponse("bottom");
      document.addEventListener("keydown", (e) => {
        if (topBtn.disabled) return;
        if (e.key === "ArrowUp") recordResponse("top");
        if (e.key === "ArrowDown") recordResponse("bottom");
      });
      function downloadCSV() {
        const headers = Object.keys(results[0] || {});
        let csv = headers.join(",") + "\n";
        results.forEach(
          (r) => (csv += headers.map((h) => r[h]).join(",") + "\n"),
        );
        const blob = new Blob(["\uFEFF" + csv], {
          type: "text/csv;charset=utf-8;",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `MullerLyer_${participantId}.csv`;
        a.click();
      }
async function sendToGAS(){

    if(
        GAS_URL ===
        "PASTE_YOUR_GAS_URL_HERE"
    ){
        return false;
    }

    const payload = {

        participantId,

        data: results

    };

    try{

        const response =

            await fetch(

                GAS_URL,

                {

                    method: "POST",

                    body:
                        new URLSearchParams({

                            data:
                                JSON.stringify(
                                    payload
                                )

                        })

                }

            );

        return response.ok;

    }catch(e){

        console.error(e);

        return false;

    }

}
      async function finishTask() {
        setBtns(false);
        const ok = await sendToGAS();
        downloadCSV();
        feedback.innerHTML = `<h2>終了</h2><p>試行数:${results.length}</p><p>GAS:${ok ? "成功" : "未設定/失敗"}</p>`;
      }
    </script>
  </body>
</html>
