<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>IGT Demo</title>

<style>
body{
    font-family:sans-serif;
    text-align:center;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.deck{
    width:140px;
    height:180px;
    margin:10px;
    font-size:2rem;
    cursor:pointer;
}

#balance{
    font-size:1.5rem;
    font-weight:bold;
}

#trial{
    margin-top:10px;
    margin-bottom:20px;
}

#feedback{
    min-height:100px;
    margin-top:20px;
}

button:disabled{
    opacity:.5;
}
</style>
</head>

<body>

<h1>アイオワギャンブル課題</h1>
<p>本課題では、４つのデッキから好きな1つを選んでもらいます。<br>
　　　選んだデッキによって報酬か罰金が得られます。<br>
　　　選択を100回繰り返します。できるだけ所持金が多く得られるようにデッキを選んでみてください。</p>

<div id="start-screen">

    <p>
        準備ができたら開始ボタンを押してください
    </p>

    <button onclick="startTask()">
        開始
    </button>

</div>

<div id="experiment" style="display:none;">

    <div id="balance">
        所持金: 2000
    </div>

    <div id="trial">
        試行: 0 / 100
    </div>

    <div>

        <button class="deck"
                onclick="chooseDeck('A')">
            A
        </button>

        <button class="deck"
                onclick="chooseDeck('B')">
            B
        </button>

        <button class="deck"
                onclick="chooseDeck('C')">
            C
        </button>

        <button class="deck"
                onclick="chooseDeck('D')">
            D
        </button>

    </div>

    <div id="feedback">
        デッキを選択してください
    </div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbw0Yx17M1dc4oVUQ9_WldRK-U5rnKPD8ehiAVNheeYxpUGOn_xtqoe7lgnOyXj2m5DxIQ/exec";

const MAX_TRIALS = 100;

let participantId;

let balance = 2000;
let trial = 0;

let trialStart;

const results = [];

const counts = {
    A:0,
    B:0,
    C:0,
    D:0
};

/*
期待値

A = -25
B = -22.5

C = +25
D = +22.5
*/

const decks = {

    A:{
        outcomes:[
            {value:100,p:0.5},
            {value:-150,p:0.5}
        ]
    },

    B:{
        outcomes:[
            {value:100,p:0.9},
            {value:-1125,p:0.1}
        ]
    },

    C:{
        outcomes:[
            {value:50,p:0.5},
            {value:0,p:0.5}
        ]
    },

    D:{
        outcomes:[
            {value:50,p:0.9},
            {value:-225,p:0.1}
        ]
    }

};

function startTask(){

    participantId =
        crypto.randomUUID();

    document
        .getElementById("start-screen")
        .style.display = "none";

    document
        .getElementById("experiment")
        .style.display = "block";

    trialStart =
        performance.now();
}

function sampleOutcome(deckName){

    const deck =
        decks[deckName];

    const r =
        Math.random();

    let cumulative = 0;

    for(const outcome of deck.outcomes){

        cumulative += outcome.p;

        if(r <= cumulative){

            return outcome.value;

        }

    }

    return deck.outcomes[
        deck.outcomes.length - 1
    ].value;
}

function chooseDeck(deckName){

    if(trial >= MAX_TRIALS){

        return;

    }

    const rt =
        Math.round(
            performance.now()
            - trialStart
        );

    const outcome =
        sampleOutcome(deckName);

    balance += outcome;

    trial++;

    counts[deckName]++;

    document
        .getElementById("balance")
        .textContent =
        `所持金: ${balance}`;

    document
        .getElementById("trial")
        .textContent =
        `試行: ${trial} / ${MAX_TRIALS}`;

    const sign =
        outcome >= 0
        ? "+"
        : "";

    document
        .getElementById("feedback")
        .innerHTML =
        `
        <p>選択: ${deckName}</p>

        <p>
            結果:
            ${sign}${outcome}
        </p>

        <p>
            反応時間:
            ${rt} ms
        </p>
        `;

    results.push({

        participantId,

        trial,

        deck:deckName,

        outcome,

        balance,

        rt,

        timestamp:
            new Date()
            .toISOString()

    });

    trialStart =
        performance.now();

    if(trial >= MAX_TRIALS){

        finishTask();

    }
}

async function finishTask(){

    document
        .querySelectorAll(".deck")
        .forEach(
            btn =>
            btn.disabled = true
        );

    document
        .getElementById("feedback")
        .innerHTML =
        "<h2>データ送信中...</h2>";

    try{

        await fetch(
            GAS_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    participantId,

                    data:results

                })
            }
        );

        const netScore =
            (counts.C + counts.D)
            -
            (counts.A + counts.B);

        document
            .getElementById("feedback")
            .innerHTML =
            `
            <h2>
                実験終了
            </h2>

            <p>
                参加者ID<br>
                ${participantId}
            </p>

            <p>
                最終所持金:
                ${balance}
            </p>

            <p>
                Net Score:
                ${netScore}
            </p>

            <p>
                データ送信完了
            </p>
            `;

    }catch(err){

        document
            .getElementById("feedback")
            .innerHTML =
            `
            <h2>
                保存エラー
            </h2>

            <pre>
${err}
            </pre>
            `;
    }
}

</script>

</body>
</html>
